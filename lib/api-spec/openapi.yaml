openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: signal
    description: SIGNAL interview communication planning
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /signal/analyze-invitation:
    post:
      operationId: analyzeInvitation
      tags: [signal]
      summary: Analyze an interview invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "200":
          description: Extracted interview details and mentioned support
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationAnalysis"
        "400":
          description: Invalid invitation text
  /signal/access-check:
    post:
      operationId: checkAccess
      tags: [signal]
      summary: Compare candidate preferences with invitation support
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessCheckInput"
      responses:
        "200":
          description: Communication access requirements and their statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCheckResult"
        "400":
          description: Invalid access check input
  /signal/accommodation-request:
    post:
      operationId: generateAccommodationRequest
      tags: [signal]
      summary: Generate an editable communication support request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccommodationRequestInput"
      responses:
        "200":
          description: Draft request email with responsible AI notice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccommodationRequest"
        "400":
          description: Invalid request input
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    InterviewDetails:
      type: object
      properties:
        company:
          type: ["string", "null"]
        position:
          type: ["string", "null"]
        date:
          type: ["string", "null"]
        time:
          type: ["string", "null"]
        format:
          type: ["string", "null"]
        platform:
          type: ["string", "null"]
        duration:
          type: ["string", "null"]
      required: [company, position, date, time, format, platform, duration]
    MentionedSupport:
      type: object
      properties:
        live_captions:
          type: boolean
        vsl_interpreter:
          type: boolean
        written_questions:
          type: boolean
        text_chat_backup:
          type: boolean
      required: [live_captions, vsl_interpreter, written_questions, text_chat_backup]
    InvitationInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
      required: [text]
    InvitationAnalysis:
      type: object
      properties:
        interview:
          $ref: "#/components/schemas/InterviewDetails"
        mentioned_support:
          $ref: "#/components/schemas/MentionedSupport"
        ai_notice:
          type: string
        requires_user_review:
          type: boolean
      required: [interview, mentioned_support, ai_notice, requires_user_review]
    CandidateProfile:
      type: object
      properties:
        preferences:
          type: array
          items:
            type: string
      required: [preferences]
    AccessCheckInput:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/CandidateProfile"
        interview:
          $ref: "#/components/schemas/InterviewDetails"
        mentioned_support:
          $ref: "#/components/schemas/MentionedSupport"
      required: [profile, interview, mentioned_support]
    AccessRequirement:
      type: object
      properties:
        name:
          type: string
        key:
          type: string
        status:
          type: string
          enum: [confirmed, needs_confirmation, unknown, not_available]
        reason:
          type: string
        recommended_action:
          type: string
      required: [name, key, status, reason, recommended_action]
    AccessCheckResult:
      type: object
      properties:
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/AccessRequirement"
        ai_notice:
          type: string
        requires_user_review:
          type: boolean
      required: [requirements, ai_notice, requires_user_review]
    AccommodationRequestInput:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/CandidateProfile"
        interview:
          $ref: "#/components/schemas/InterviewDetails"
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/AccessRequirement"
      required: [profile, interview, requirements]
    AccommodationRequest:
      type: object
      properties:
        subject:
          type: string
        body:
          type: string
        ai_notice:
          type: string
        requires_user_review:
          type: boolean
      required: [subject, body, ai_notice, requires_user_review]

